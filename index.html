<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantBuddy | Smart Plant Care</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>PlantBuddy</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="#my-plant">My Plant</a></li>
                <li><a href="#history">History</a></li>
                <li><a href="#watering-mode">Watering Mode</a></li>
                <li><a href="#activity">Activity</a></li>
            </ul>
            </nav>
    </header>

    <main>
        <section class="plant-selector">
            <h2>Your Plants</h2>
            <ul class="plant-list">
            <li><button type="button">Peperomia</button></li>
            <li><button type="button">Pothos</button></li>
            <li><button type="button">Snake Plant</button></li>
        </ul>
        <button type="button">+ Add Plant</button>
        </section>

        <section class = "plant-dashboard">
            <h2 id="greeting">Welcome!</h2>
            <p>Here's how your plant is doing today.</p>
            <div class="plant-info">
                <h3>Peperomia</h3>
                <p>Peperomia obtusifolia</p>
            </div>
            <ul class="plant-care">
                <li>Indoor</li>
                <li>Bright, Indirect Light</li>
                <li>Let Soil Partially Dry</li>
            </ul>
        </section>

    </main>

</body>
</html>
